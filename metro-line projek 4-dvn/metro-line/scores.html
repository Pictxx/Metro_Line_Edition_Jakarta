<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skor · Metro Line</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/component.css"><link rel="stylesheet" href="css/art.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body><header id="nav"></header>
<main class="container">
  <h1>Papan Skor</h1><p class="muted" style="margin:8px 0 18px">Riwayat sesi dan peringkat masinis.</p>
  <div class="card">
    <div class="toolbar">
      <div class="field"><label for="scope">Tampilkan</label><select id="scope"><option value="me">Sesi saya</option><option value="all">Semua masinis</option></select></div>
      <div class="field"><label for="sort">Urutkan</label><select id="sort"><option value="score">Skor tertinggi</option><option value="date">Terbaru</option></select></div>
      <button id="btnReset" class="btn btn-danger btn-sm">Reset Riwayat Saya</button>
    </div>
    <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Masinis</th><th>Skor</th><th>Durasi</th><th>Stasiun</th><th>Tanggal</th></tr></thead><tbody id="board"></tbody></table></div>
  </div>
</main>
<script src="js/core/storage.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/art.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/pages/scores.js"></script>
</body></html>
