<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar · Metro Line</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/component.css"><link rel="stylesheet" href="css/art.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body><main class="auth-wrap"><form id="registerForm" class="card auth-card" novalidate>
  <a href="index.html" data-logo="44"></a>
  <h2 style="text-align:center">Daftar Akun Baru</h2>
  <div id="formError" class="alert alert-error hidden"></div>
  <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" placeholder="3–16 karakter"></div>
  <div class="field"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></div>
  <div class="field"><label for="confirm">Ulangi kata sandi</label><input id="confirm" name="confirm" type="password" autocomplete="new-password"></div>
  <button class="btn btn-primary" type="submit">Buat Akun</button>
  <p class="muted" style="text-align:center">Sudah punya akun? <a href="login.html">Masuk</a></p>
  <div class="rail-accent"></div>
</form></main>
<script src="js/core/storage.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/art.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/pages/auth.js"></script>
</body></html>
